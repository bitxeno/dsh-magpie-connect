name: release

# Release flow: the version is bumped in package.json + dsh.plugin.json by a
# `chore(release)` commit; any push touching those files re-runs the whole
# pipeline. Tests/build run locally before the bump (devDependencies are
# machine-local `link:` entries CI cannot install); the committed lib/ is what
# gets published. A manual run re-checks the current files without a push.
on:
  push:
    branches: [main]
    paths: ['package.json', 'dsh.plugin.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve the version to release
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PLUGIN_VERSION="$(node -p "require('./dsh.plugin.json').version")"
          if [ "$VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::version mismatch: package.json is $VERSION but dsh.plugin.json is $PLUGIN_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # The release notes come from changelogithub (conventional commits since
      # the last tag). `--output` writes the notes to a file instead of creating
      # the release itself — the tag/gh steps below own idempotency and the
      # prerelease flag. GITHUB_TOKEN lets changelogithub resolve commit authors
      # to GitHub usernames. The run happens BEFORE the tag exists so the
      # from-range still ends at the last release tag.
      - name: Generate the release notes with changelogithub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npx --yes changelogithub --output "$RUNNER_TEMP/release-notes.md"

      # Pushing a tree that still carries the old version (e.g. a feature
      # commit touching package.json) must not re-release, so each step below
      # checks its own effect rather than sharing one "is this new" flag. That
      # matters when a step fails partway: with a shared flag, a run that
      # tagged but could not publish would skip the publish on every retry,
      # leaving the release permanently half-done. Independently idempotent
      # steps make a re-run finish whatever is missing and no-op the rest.
      - name: Create the tag if missing
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; leaving it"
            exit 0
          fi
          # Annotated tags need a committer identity; the runner has none.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      # `--generate-notes` appends GitHub's autogenerated changelog below the
      # changelogithub notes (the "What's Changed" section from the release API).
      - name: Create the GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; leaving it"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            gh release create "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --prerelease
          else
            gh release create "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi

      # Skipped when this exact version is already on the registry, so a
      # re-run after a transient failure retries the publish instead of
      # silently declaring the release complete.
      - name: Publish to npm if missing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "$(node -p "require('./package.json').name")@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already published; leaving it"
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
